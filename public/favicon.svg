<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#0B0F19"/>
  <!-- Connecting network lines -->
  <path d="M20 42L32 20L44 42L32 34Z" fill="url(#grad1)" opacity="0.3"/>
  <line x1="20" y1="42" x2="32" y2="20" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="44" y2="42" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="42" x2="44" y2="42" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="32" y2="42" stroke="#6366F1" stroke-width="2" stroke-dasharray="2 2"/>
  
  <!-- Nodes (Customer, Cooperative, Worker) -->
  <!-- Top Node: Cooperative -->
  <circle cx="32" cy="20" r="6" fill="#4F46E5" stroke="#818CF8" stroke-width="2"/>
  <circle cx="32" cy="20" r="2.5" fill="#FFFFFF"/>
  
  <!-- Left Node: Worker -->
  <circle cx="20" cy="42" r="5.5" fill="#10B981" stroke="#6EE7B7" stroke-width="2"/>
  <circle cx="20" cy="42" r="2" fill="#FFFFFF"/>
  
  <!-- Right Node: Customer -->
  <circle cx="44" cy="42" r="5.5" fill="#F59E0B" stroke="#FDE68A" stroke-width="2"/>
  <circle cx="44" cy="42" r="2" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="grad1" x1="32" y1="20" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>